name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: main - luwah-technologies

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26" # Match local dev and the Render runtime (engines.node).
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `next lint` was removed in Next 16. Type check is the gate.
      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}

      # Render auto-deploys from GitHub, so this step is informational.
      # If using manual deploy, add Render deploy hook here.

      - name: Notify Proxmox n8n of Successful Deploy
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          curl -X POST ${{ secrets.N8N_DEPLOY_WEBHOOK_URL }} \
          -H "Content-Type: application/json" \
          -d '{"status": "success", "project": "luwah-technologies", "commit": "${{ github.sha }}", "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' \
          && echo "Deployment synced with home lab."
        continue-on-error: true
