apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# The one place the image is set. Both values are placeholders: point newName
# at the registry the image is pushed to, and set newTag to the build id
# (git rev-parse --short HEAD). Renovate or an Argo Image Updater can own
# newTag later. Left as-is, the pod fails with ImagePullBackOff instead of
# pulling something unintended.
images:
  - name: luwah-site
    newName: ghcr.io/luwahtechnologies/luwah-site
    newTag: unset
